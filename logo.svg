<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 512 512" width="100%" height="100%">
  <defs>
    <!-- Background Gradient -->
    <linearGradient id="bgGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#07070d" />
      <stop offset="50%" stop-color="#0f0e1d" />
      <stop offset="100%" stop-color="#05050a" />
    </linearGradient>
    
    <!-- Music Note Gradient -->
    <linearGradient id="noteGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#a855f7" />
      <stop offset="100%" stop-color="#6366f1" />
    </linearGradient>

    <!-- Clash Bolt Gradient -->
    <linearGradient id="clashGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#f43f5e" />
      <stop offset="100%" stop-color="#ec4899" />
    </linearGradient>

    <!-- Glow Effect -->
    <filter id="glow" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="10" result="blur" />
      <feComposite in="SourceGraphic" in2="blur" operator="over" />
    </filter>
  </defs>

  <!-- Dark Rounded Base -->
  <rect width="512" height="512" rx="128" fill="url(#bgGrad)" stroke="#1e1b4b" stroke-width="6"/>

  <!-- Aesthetic Sound Wave Rings (Concentric Circles) -->
  <circle cx="256" cy="256" r="180" fill="none" stroke="#6366f1" stroke-width="2" stroke-dasharray="8 12" opacity="0.2"/>
  <circle cx="256" cy="256" r="210" fill="none" stroke="#a855f7" stroke-width="1.5" stroke-dasharray="16 16" opacity="0.15"/>
  <circle cx="256" cy="256" r="150" fill="none" stroke="#ec4899" stroke-width="1" opacity="0.1"/>

  <!-- The "Clash" Soundwaves -->
  <g filter="url(#glow)">
    <!-- Right Wave -->
    <path d="M 330 190 Q 370 230 330 270" fill="none" stroke="url(#noteGrad)" stroke-width="12" stroke-linecap="round" opacity="0.8"/>
    <path d="M 360 160 Q 420 230 360 300" fill="none" stroke="url(#noteGrad)" stroke-width="8" stroke-linecap="round" opacity="0.5"/>
    
    <!-- Left Wave -->
    <path d="M 182 190 Q 142 230 182 270" fill="none" stroke="url(#clashGrad)" stroke-width="12" stroke-linecap="round" opacity="0.8"/>
    <path d="M 152 160 Q 92 230 152 300" fill="none" stroke="url(#clashGrad)" stroke-width="8" stroke-linecap="round" opacity="0.5"/>
  </g>

  <!-- Stylized Eighth Music Note -->
  <g transform="translate(10, -5)" filter="url(#glow)">
    <!-- Note Stem & Flag -->
    <path d="M 270 130 L 270 300 C 270 330 240 350 210 350 C 180 350 160 330 160 300 C 160 270 180 250 210 250 C 230 250 248 260 256 274 L 256 160 L 330 190 L 330 150 Z" fill="url(#noteGrad)"/>
  </g>

  <!-- The "Clash" Lightning Bolt (Intersecting dynamically) -->
  <polygon points="210,100 310,240 250,250 300,410 190,260 240,250" fill="url(#clashGrad)" filter="url(#glow)" transform="rotate(-15 256 256)"/>
</svg>
